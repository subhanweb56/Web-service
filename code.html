<style>
        .glass-panel {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 0.5px solid rgba(255, 255, 255, 0.1);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-background text-on-surface min-h-screen flex flex-col font-body-md selection:bg-primary-container selection:text-on-primary-container pb-safe-area-bottom">
<!-- TopAppBar -->
<header class="fixed top-0 w-full bg-surface/5 backdrop-blur-xl border-b border-white/10 z-50">
<div class="flex justify-between items-center px-margin-mobile py-4 max-w-7xl mx-auto">
<button class="hover:opacity-80 transition-opacity active:scale-95 text-on-surface flex items-center justify-center">
<span class="material-symbols-outlined text-[24px]">close</span>
</button>
<h1 class="font-display-lg text-headline-md tracking-widest text-primary">MERIDIEN</h1>
<div class="w-6"></div> <!-- Spacer for alignment -->
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow pt-[80px] px-margin-mobile max-w-3xl mx-auto w-full flex flex-col gap-stack-lg pb-32">
<!-- Progress Indicator -->
<div class="flex justify-between items-center pt-stack-md">
<span class="font-label-md text-label-md text-primary">01 <span class="text-on-surface-variant">/ 05</span></span>
<div class="flex-grow mx-4 h-[2px] bg-surface-container-high rounded-full overflow-hidden">
<div class="h-full bg-primary w-1/5 rounded-full"></div>
</div>
<span class="font-label-md text-label-md text-on-surface-variant">Room</span>
</div>
<!-- Step 1: Room Summary -->
<section class="glass-panel rounded-2xl p-6 flex gap-4">
<div class="w-24 h-24 rounded-lg overflow-hidden shrink-0">
<img class="w-full h-full object-cover" data-alt="A luxurious hotel suite bedroom with a king-size bed, crisp white linens, and large floor-to-ceiling windows overlooking a city skyline at dusk. The lighting is warm and ambient, featuring soft lamps and deep shadows, fitting a premium, high-end editorial aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuC6YEGeoqUrBE_-Iu2vtoR1LfJHIJa80U6iHYaZQENbYvQ82WvOcKBGWtL3l7gCYHWif_Wg7rVrqmR40ip2ibK3Swah_Kl-9u4LR9bxcL4WseBoXhaCcIGLUlp6qYG_R1bkXUeBTIIAvrmqPI_hwc9B_D-OKIL-9_3L4i7ZrqpxhW2f9NfKQRHJygd_66yERdPJhIpFwYqsdBa5QnpfD7-HT1o1cWpKqC7Chaocm06NDI4CRqQxLD6iaw"/>
</div>
<div class="flex flex-col justify-center">
<h2 class="font-headline-md text-headline-md text-on-surface mb-1">Executive Suite</h2>
<p class="font-body-md text-body-md text-on-surface-variant mb-2">King Bed • City View</p>
<div class="flex flex-wrap gap-2">
<span class="bg-surface-variant text-on-surface px-2 py-1 rounded font-caption text-caption">WiFi</span>
<span class="bg-surface-variant text-on-surface px-2 py-1 rounded font-caption text-caption">Mini Bar</span>
</div>
</div>
</section>
<!-- Step 2: Date Picker (Simplified visualization) -->
<section class="glass-panel rounded-2xl p-6">
<h3 class="font-headline-md text-headline-md mb-4 flex items-center gap-2">
<span class="material-symbols-outlined text-primary">calendar_month</span> Dates
            </h3>
<div class="grid grid-cols-2 gap-4">
<div class="border-b border-surface-variant pb-2 focus-within:border-primary transition-colors">
<label class="block font-caption text-caption text-on-surface-variant mb-1">Check-in</label>
<div class="font-body-md text-body-md text-on-surface">Oct 24, 2024</div>
</div>
<div class="border-b border-surface-variant pb-2 focus-within:border-primary transition-colors">
<label class="block font-caption text-caption text-on-surface-variant mb-1">Check-out</label>
<div class="font-body-md text-body-md text-on-surface">Oct 27, 2024</div>
</div>
</div>
</section>
<!-- Step 3: Guest Selector -->
<section class="glass-panel rounded-2xl p-6">
<h3 class="font-headline-md text-headline-md mb-4 flex items-center gap-2">
<span class="material-symbols-outlined text-primary">group</span> Guests
            </h3>
<div class="flex flex-col gap-4">
<div class="flex justify-between items-center border-b border-white/5 pb-4">
<div>
<div class="font-body-md text-body-md text-on-surface">Adults</div>
<div class="font-caption text-caption text-on-surface-variant">Ages 13 or above</div>
</div>
<div class="flex items-center gap-4">
<button class="w-8 h-8 rounded-full border border-surface-variant flex items-center justify-center text-on-surface-variant hover:border-primary hover:text-primary transition-colors"><span class="material-symbols-outlined">remove</span></button>
<span class="font-body-md text-body-md w-4 text-center">2</span>
<button class="w-8 h-8 rounded-full border border-surface-variant flex items-center justify-center text-on-surface-variant hover:border-primary hover:text-primary transition-colors"><span class="material-symbols-outlined">add</span></button>
</div>
</div>
<div class="flex justify-between items-center">
<div>
<div class="font-body-md text-body-md text-on-surface">Children</div>
<div class="font-caption text-caption text-on-surface-variant">Ages 2-12</div>
</div>
<div class="flex items-center gap-4">
<button class="w-8 h-8 rounded-full border border-surface-variant flex items-center justify-center text-on-surface-variant hover:border-primary hover:text-primary transition-colors"><span class="material-symbols-outlined">remove</span></button>
<span class="font-body-md text-body-md w-4 text-center">0</span>
<button class="w-8 h-8 rounded-full border border-surface-variant flex items-center justify-center text-on-surface-variant hover:border-primary hover:text-primary transition-colors"><span class="material-symbols-outlined">add</span></button>
</div>
</div>
</div>
</section>
<!-- Price Summary -->
<section class="glass-panel rounded-2xl p-6">
<h3 class="font-headline-md text-headline-md mb-4">Summary</h3>
<div class="flex flex-col gap-2 font-body-md text-body-md text-on-surface-variant border-b border-white/5 pb-4 mb-4">
<div class="flex justify-between">
<span>$450 x 3 nights</span>
<span class="text-on-surface">$1,350</span>
</div>
<div class="flex justify-between">
<span>Taxes &amp; Fees</span>
<span class="text-on-surface">$189</span>
</div>
</div>
<div class="flex justify-between items-center font-headline-md text-headline-md text-on-surface">
<span>Total</span>
<span class="text-primary">$1,539</span>
</div>
</section>
</main>
<!-- Fixed Bottom Action -->
<div class="fixed bottom-0 w-full p-4 bg-background/90 backdrop-blur-md border-t border-white/5 z-40 pb-safe-area-bottom">
<div class="max-w-3xl mx-auto">
<button class="w-full bg-primary-container text-on-primary-container font-label-md text-label-md py-4 rounded-lg hover:opacity-90 active:scale-95 transition-all shadow-[0_20px_40px_rgba(0,0,0,0.5)]">
                Continue
            </button>
</div>
</div>
</body></html>
